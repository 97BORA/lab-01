<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lab-01</title>

        <style>
            .initial-loader {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: grid;
                place-items: center;
                background-color: rgba(0, 0, 0, 0.9);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition:
                    opacity 300ms ease,
                    visibility 300ms ease;
            }

            .initial-loader--visible {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .initial-loader--hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .initial-loader .initial-loader-dots {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: center;
            }

            .initial-loader .initial-loader-dots span {
                width: 13px;
                height: 13px;
                background-color: white;
                border-radius: 50%;
                opacity: 0.35;
                animation: initial-loader-bounce 1.2s infinite ease-in-out;
            }

            .initial-loader .initial-loader-dots span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .initial-loader .initial-loader-dots span:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes initial-loader-bounce {
                0%,
                80%,
                100% {
                    transform: scale(0.7);
                    opacity: 0.35;
                }

                40% {
                    transform: scale(1.2);
                    opacity: 1;
                }
            }
        </style>
    </head>

    <body>
        <!-- initial loader -->
        <div id="initial-loader" class="initial-loader">
            <div class="initial-loader-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- initial loader script -->
        <script>
            window.__initialLoaderTimers = [
                window.setTimeout(() => {
                    document
                        .getElementById('initial-loader')
                        ?.classList.add('initial-loader--visible');
                }, 150),
            ];
        </script>

        <!-- root -->
        <div id="root"></div>

        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
